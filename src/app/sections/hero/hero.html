<section id="home" class="hero">
  <img
    class="hero__img"
    src="images/catedral.jpg"
    [alt]="t().heroAlt"
    fetchpriority="high"
  />
  <div class="hero__shade" aria-hidden="true"></div>

  <div class="hero__content">
    <p class="hero__kicker">{{ t().kicker }}</p>
    <h1 class="hero__names">
      <span class="hero__name">{{ w().partnerOne }}</span>
      <span class="hero__amp" [attr.aria-label]="t().and">&amp;</span>
      <span class="hero__name">{{ w().partnerTwo }}</span>
    </h1>
    <ul class="hero__dates">
      @for (wedding of weddings; track wedding.label) {
        <li class="hero__event">
          <span class="hero__label"><app-wedding-label [code]="wedding.code" /></span>
          <span class="hero__date">{{ wedding.dateText }}</span>
        </li>
      }
    </ul>
  </div>

  <a class="hero__scroll" href="#countdown" [attr.aria-label]="t().scrollDown">
    <span></span>
  </a>
</section>
