<section id="schedule" class="section">
  <div class="container">
    <header class="section-head" appReveal>
      <span class="eyebrow">{{ w().scheduleTitle }}</span>
      <h2 class="section-title">{{ t().scheduleTitle }}</h2>
    </header>

    <ol class="timeline">
      @for (item of items(); track $index; let odd = $odd) {
        <li class="step" [class.step--right]="odd" appReveal>
          <div class="step__card">
            <span class="step__time">{{ item.time }}</span>
            <h3 class="step__title">{{ item.title }}</h3>
            <p class="step__desc">{{ item.description }}</p>
          </div>
          <span class="step__icon"><app-icon [name]="$any(item.icon)" /></span>
        </li>
      }
    </ol>

    <p class="note" appReveal>{{ w().scheduleNote }}</p>
  </div>
</section>
