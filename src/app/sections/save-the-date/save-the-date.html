<section class="std">
  <div class="std__band" aria-hidden="true">
    <img src="images/atardecer.jpg" alt="" loading="lazy" />
  </div>

  <div class="std__body" appReveal>
    <span class="eyebrow">{{ t().saveTheDate }}</span>
    <h2 class="std__names">
      <span>{{ w().partnerOne }}</span>
      <span class="std__amp"><i></i>&amp;<i></i></span>
      <span>{{ w().partnerTwo }}</span>
    </h2>
    <ul class="std__dates">
      @for (wedding of weddings; track wedding.label) {
        <li>
          <span class="std__label"><app-wedding-label [code]="wedding.code" /></span>
          <span class="std__date">{{ wedding.dateText }} · {{ wedding.place }}</span>
        </li>
      }
    </ul>
    <a class="btn btn--gold" href="#rsvp">{{ t().rsvpBy }} {{ deadline() }}</a>
    <hr class="divider" />
    <p class="std__text">
      {{ t().stdText }}
    </p>
    <hr class="divider" />
  </div>
</section>
